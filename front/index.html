
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Чат поддержки</title>


  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar">
    <div class="logo">
      <div class="logo-icon"></div>
      <div class="logo-text">Веб-мастер</div>
    </div>
    <div class="info">
      Мы создаём сайты, которые работают за вас!
    </div>
  </div>

<div class="chat-container">
  <div class="chat-header">
    <button id="reset-btn" class="material-symbols-outlined" title="Перезагрузить чат">refresh</button>
  </div>
  <div id="chatbox"></div>
  <div id="input-area">
    <textarea id="message-input" placeholder="Напишите ваш вопрос..."></textarea>
    <button id="send-btn" class="material-symbols-outlined">send</button>
  </div>
</div>

  <script src="script.js" defer></script>
</body>
</html>
